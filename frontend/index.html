<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if (window.WebSocket) {
            var OrigWS = window.WebSocket;
            function MockWS(url, protocols) {
              var target = new EventTarget();
              target.url = url;
              target.protocols = protocols;
              target.readyState = 1;
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CLOSING = 2;
              target.CONNECTING = 0;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = Array.isArray(protocols) ? (protocols[0] || '') : (protocols || '');
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              return target;
            }
            MockWS.CONNECTING = 0;
            MockWS.OPEN = 1;
            MockWS.CLOSING = 2;
            MockWS.CLOSED = 3;
            MockWS.prototype = OrigWS.prototype;

            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))
              ) {
                return MockWS(url, protocols);
              }
              try {
                return new OrigWS(url, protocols);
              } catch (e) {
                return MockWS(url, protocols);
              }
            };
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
            window.WebSocket.prototype = OrigWS.prototype;
          }

          window.addEventListener('error', function(event) {
            var msg = String(event.message || (event.error && event.error.message) || '');
            var src = String(event.filename || (event.error && event.error.stack) || '');
            if (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
              src.indexOf('@vite/client') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = String((event.reason && event.reason.message) || event.reason || '');
            var stack = String((event.reason && event.reason.stack) || '');
            if (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
              stack.indexOf('@vite/client') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
    <title>Foner — Online Store</title>
